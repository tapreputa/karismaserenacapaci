<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b99a78">
  <title>Karisma Estetiquè | Recensione Google</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
      background: #d9c3a8;
    }

    body {
      min-height: 100svh;
      color: #fff;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(16px, env(safe-area-inset-bottom));
      background:
        linear-gradient(
          180deg,
          rgba(53, 38, 27, .18) 0%,
          rgba(53, 38, 27, .08) 33%,
          rgba(53, 38, 27, .18) 66%,
          rgba(36, 25, 18, .46) 100%
        ),
        url("./sfondo.png") center center / cover no-repeat;
    }

    .content {
      width: min(94vw, 520px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand {
      width: min(90vw, 500px);
      max-height: 180px;
      object-fit: contain;
      display: block;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(54, 36, 22, .18);
    }

    .eyebrow {
      font-size: clamp(.80rem, 3.3vw, .98rem);
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #fffaf4;
      text-shadow: 0 2px 10px rgba(0,0,0,.48);
      margin-bottom: 14px;
    }

    .card {
      width: 100%;
      padding: 22px 20px 20px;
      border: 1px solid rgba(255,255,255,.50);
      border-radius: 24px;
      background: rgba(255, 250, 244, .90);
      color: #4a382c;
      box-shadow:
        0 14px 38px rgba(47, 31, 20, .23),
        inset 0 1px 0 rgba(255,255,255,.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .message {
      font-size: clamp(1rem, 4.05vw, 1.16rem);
      line-height: 1.42;
      font-weight: 650;
      text-wrap: balance;
      margin-bottom: 20px;
    }

    .review-btn {
      position: relative;
      width: min(100%, 410px);
      min-height: 58px;
      margin: 0 auto;
      padding: 15px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-size: clamp(1rem, 4vw, 1.10rem);
      font-weight: 800;
      letter-spacing: .01em;
      background: linear-gradient(135deg, #8b684c 0%, #b7956e 49%, #8d6b4f 100%);
      box-shadow:
        0 9px 22px rgba(87, 58, 38, .29),
        inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .review-btn:active {
      transform: scale(.975);
      box-shadow:
        0 5px 14px rgba(87,58,38,.24),
        inset 0 1px 0 rgba(255,255,255,.24);
    }

    .google-g {
      position: relative;
      z-index: 2;
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #4285f4;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 1px 5px rgba(0,0,0,.16);
    }

    .btn-label {
      position: relative;
      z-index: 2;
    }

    .review-btn::before {
      content: "";
      position: absolute;
      top: -42%;
      left: -45%;
      width: 30%;
      height: 185%;
      transform: rotate(18deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.08),
        rgba(255,247,219,.72),
        rgba(255,255,255,.10),
        transparent
      );
      animation: sweep 3.5s ease-in-out infinite;
    }

    @keyframes sweep {
      0%, 16% { left: -45%; opacity: 0; }
      24% { opacity: 1; }
      61% { left: 118%; opacity: 1; }
      70%, 100% { left: 118%; opacity: 0; }
    }

    .sparkle {
      position: absolute;
      z-index: 1;
      border-radius: 50%;
      background: #fff6d6;
      box-shadow: 0 0 9px rgba(255,236,182,.95);
      opacity: 0;
      animation: sparkle 2.9s ease-in-out infinite;
    }

    .s1 {
      width: 5px; height: 5px;
      left: 18%; top: 27%;
      animation-delay: .15s;
    }

    .s2 {
      width: 4px; height: 4px;
      right: 20%; top: 62%;
      animation-delay: .9s;
    }

    .s3 {
      width: 3px; height: 3px;
      right: 31%; top: 25%;
      animation-delay: 1.5s;
    }

    @keyframes sparkle {
      0%, 24%, 100% { opacity: 0; transform: scale(.4); }
      38% { opacity: .95; transform: scale(1.45); }
      54% { opacity: 0; transform: scale(.55); }
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 16px;
      color: #f4b400;
      font-size: clamp(1.45rem, 6.6vw, 1.95rem);
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(122,84,30,.18));
    }

    footer {
      margin-top: 14px;
      font-size: .82rem;
      font-weight: 600;
      color: rgba(255,255,255,.95);
      text-shadow: 0 2px 8px rgba(0,0,0,.50);
    }

    footer strong {
      color: #d8f2df;
      font-weight: 800;
    }

    @media (max-width: 480px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .content {
        width: min(96vw, 500px);
      }

      .brand {
        width: min(92vw, 460px);
        max-height: 165px;
        margin-bottom: 16px;
      }

      .eyebrow {
        margin-bottom: 13px;
      }

      .card {
        padding: 21px 17px 18px;
        border-radius: 22px;
      }

      .message {
        margin-bottom: 18px;
      }

      .review-btn {
        min-height: 56px;
      }

      .stars {
        margin-top: 15px;
      }

      footer {
        margin-top: 13px;
      }
    }

    @media (max-height: 720px) {
      .page {
        justify-content: flex-start;
        padding-top: 12px;
      }

      .brand {
        width: min(80vw, 390px);
        max-height: 125px;
        margin-bottom: 10px;
      }

      .eyebrow {
        margin-bottom: 10px;
      }

      .card {
        padding-top: 16px;
        padding-bottom: 15px;
      }

      .message {
        margin-bottom: 13px;
        line-height: 1.34;
      }

      .stars {
        margin-top: 10px;
      }

      footer {
        margin-top: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .review-btn::before,
      .sparkle {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content">
      <img
        class="brand"
        src="./logo.png"
        alt="Karisma centro estetica"
      >

      <div class="eyebrow">La tua opinione conta</div>

      <div class="card">
        <p class="message">
          Il tuo feedback ci aiuta a fare sempre meglio.
          Dicci la tua! Bastano 2 secondi!
        </p>

        <a
          class="review-btn"
          href="https://search.google.com/local/writereview?placeid=ChIJ1TVMQb_rGRMRlGdwPPOZgoQ"
          aria-label="Lascia una recensione Google a Karisma Estetiquè"
        >
          <span class="sparkle s1"></span>
          <span class="sparkle s2"></span>
          <span class="sparkle s3"></span>
          <span class="google-g">G</span>
          <span class="btn-label">Recensione Google</span>
        </a>

        <div class="stars" aria-label="5 stelle">
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>★</span>
        </div>
      </div>

      <footer>
        Powered by <strong>Tapreputa</strong>
      </footer>
    </section>
  </main>
</body>
</html>
